<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cajero K.O.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EBEBEB;
    --ink: #564256;
    --ink-soft: #7A6B7A;
    --card: #FFFFFF;
    --line: #DADADA;

    --kat-primary: #B38D97;
    --kat-dark: #564256;
    --kat-tint: #F3E9EC;

    --oli-primary: #3581B8;
    --oli-light: #D0F4EA;
    --oli-tint: #E6F3F9;

    --danger: #9B4351;
    --radius: 16px;
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Quicksand',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;
  }
  h1,h2,h3{ font-family:'Quicksand',sans-serif; font-weight:700; margin:0; }
  .num{ font-variant-numeric:tabular-nums; font-weight:600; }

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, var(--kat-dark) 0%, var(--oli-primary) 100%);
    padding:24px;
  }
  .login-card{
    background:var(--card); border-radius:22px; padding:40px 32px; width:100%; max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .login-card h1{ font-size:28px; color:var(--ink); margin-bottom:4px; }
  .login-card p{ color:var(--ink-soft); margin:0 0 24px; font-size:14px; font-weight:500; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:6px; font-weight:600; }
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-family:'Quicksand',sans-serif; font-size:15px; font-weight:500; background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--ink); }
  .field-check{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--ink); }
  .field-check input{ width:auto; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:12px; padding:12px 18px; font-family:'Quicksand',sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--ink); color:#fff; width:100%; }
  .btn-primary:hover{ opacity:.9; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-katerine{ background:var(--kat-primary); color:#fff; }
  .btn-oliver{ background:var(--oli-primary); color:#fff; }
  .btn-small{ padding:8px 12px; font-size:12.5px; border-radius:10px; }
  #loginError{ color:var(--danger); font-size:13px; margin-top:10px; min-height:16px; font-weight:600; }

  /* ---------- App shell ---------- */
  #appShell{ display:none; }
  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--ink); color:#fff;
    padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
  }
  header.topbar .brand{ display:flex; align-items:center; gap:10px; }
  header.topbar .brand-mark{
    width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg, var(--kat-primary), var(--oli-primary));
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  header.topbar h1{ font-size:19px; color:#fff; }
  header.topbar .who{ font-size:12px; color:#D9CDD9; font-weight:600; }
  #logoutBtn{ background:none; border:1px solid rgba(255,255,255,.3); color:#EFE7EF; border-radius:10px; padding:6px 10px; font-size:12px; cursor:pointer; font-family:'Quicksand',sans-serif; font-weight:600; }

  main{ max-width:680px; margin:0 auto; padding:20px 16px 40px; }

  /* Bottom nav */
  nav.bottomnav{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--ink); display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottomnav button{
    flex:1; background:none; border:none; color:#C9B9C9; font-family:'Quicksand',sans-serif;
    font-size:10.5px; font-weight:600; padding:8px 2px; border-radius:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.bottomnav button .ic{ font-size:18px; }
  nav.bottomnav button.active{ color:#fff; background:rgba(255,255,255,.14); }

  .view{ display:none; }
  .view.active{ display:block; animation:fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Segmented control ---------- */
  .segmented{ display:flex; background:#DEDEDE; border-radius:12px; padding:4px; margin-bottom:16px; gap:4px; }
  .segmented button{
    flex:1; border:none; background:transparent; padding:9px 6px; border-radius:9px; font-family:'Quicksand',sans-serif;
    font-weight:700; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .segmented button.active{ background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.15); }

  /* ---------- Summary cards ---------- */
  .balance-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .balance-card{
    border-radius:var(--radius); padding:18px 16px;
    border:1px solid var(--line); position:relative; overflow:hidden;
  }
  .balance-card.card-katerine{ background:var(--kat-tint); }
  .balance-card.card-oliver{ background:var(--oli-tint); }
  .balance-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
  }
  .balance-card.card-katerine::before{ background:var(--kat-primary); }
  .balance-card.card-oliver::before{ background:var(--oli-primary); }
  .balance-card .name{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:6px; font-weight:700; }
  .balance-card .amount{ font-size:23px; font-weight:700; }
  .balance-card .amount.neg{ color:var(--danger); }
  .balance-card .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-weight:600; }

  .section-title{ display:flex; align-items:center; justify-content:space-between; margin:24px 0 12px; }
  .section-title h2{ font-size:18px; }
  .section-title:first-child{ margin-top:0; }

  /* ---------- Receipt-style list items ---------- */
  .receipt{
    background:var(--card); border-radius:12px; margin-bottom:10px; padding:14px 16px 14px 20px;
    border:1px solid var(--line); position:relative;
  }
  .receipt::before{
    content:""; position:absolute; left:0; top:8px; bottom:8px; width:4px; border-radius:4px;
    background:var(--ink-soft);
  }
  .receipt.persona-katerine::before{ background:var(--kat-primary); }
  .receipt.persona-oliver::before{ background:var(--oli-primary); }
  .receipt.persona-5050::before{ background:linear-gradient(180deg, var(--kat-primary) 0 50%, var(--oli-primary) 50% 100%); }
  .receipt-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .receipt-title{ font-weight:700; font-size:15px; }
  .receipt-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-weight:600; }
  .receipt-amount{ font-weight:700; font-size:15px; white-space:nowrap; }
  .tag{
    display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:20px; margin-top:6px; margin-right:4px;
    background:#EDEDED; color:var(--ink-soft); font-family:'Quicksand',sans-serif; font-weight:700;
  }
  .tag.planificado{ background:#F3E9EC; color:var(--kat-dark); }
  .tag.ejecutado{ background:var(--oli-light); color:var(--oli-primary); }
  .tag.cancelado{ background:#F1E1E4; color:var(--danger); }
  .tag.personal{ background:#EDE6F0; color:var(--ink); }
  .strike{ text-decoration:line-through; opacity:.55; }
  .actions-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  .fab{
    position:fixed; right:18px; bottom:88px; z-index:25;
    width:56px; height:56px; border-radius:50%; background:var(--ink); color:#fff;
    font-size:26px; border:none; box-shadow:0 8px 20px rgba(86,66,86,.4); cursor:pointer;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(86,66,86,.45); z-index:50;
    align-items:flex-end; justify-content:center;
  }
  .modal-overlay.active{ display:flex; }
  .modal{
    background:var(--bg); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:24px 20px 32px;
    max-height:88vh; overflow-y:auto; animation:slideUp .2s ease;
  }
  @keyframes slideUp{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .modal h3{ font-size:19px; margin-bottom:16px; }
  .modal-close{ float:right; background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; }
  .empty-state{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-weight:600; }
  .empty-state .ic{ font-size:34px; display:block; margin-bottom:10px; }

  /* ---------- Metas ---------- */
  .meta-card{
    background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px; border:1px solid var(--line);
    display:flex; gap:14px; align-items:center;
  }
  .meta-photo{ width:56px; height:56px; border-radius:12px; object-fit:cover; background:#DEDEDE; flex-shrink:0; }
  .meta-photo.placeholder{ display:flex; align-items:center; justify-content:center; font-size:24px; }
  .meta-info{ flex:1; min-width:0; }
  .meta-info .title{ font-weight:700; font-size:15px; }
  .meta-info .prog-text{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:2px; }
  .meta-bar-track{ height:8px; background:#E3E3E3; border-radius:8px; margin-top:8px; overflow:hidden; }
  .meta-bar-fill{ height:100%; border-radius:8px; background:linear-gradient(90deg, var(--kat-primary), var(--oli-primary)); }

  /* ---------- Ring (progreso circular) ---------- */
  .ring-wrap{ position:relative; width:78px; height:78px; flex-shrink:0; }
  .ring{ width:78px; height:78px; border-radius:50%; }
  .ring-center{
    position:absolute; inset:8px; background:var(--bg); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; text-align:center;
  }

  /* ---------- Visual dashboard ---------- */
  .fact-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .fact-card{
    background:var(--card); border-radius:var(--radius); padding:16px; border:1px solid var(--line); text-align:center;
  }
  .fact-card .ic{ font-size:26px; display:block; margin-bottom:6px; }
  .fact-card .val{ font-size:18px; font-weight:700; }
  .fact-card .lbl{ font-size:11px; color:var(--ink-soft); font-weight:600; margin-top:2px; }
  .chart-card{
    background:var(--card); border-radius:var(--radius); padding:16px; border:1px solid var(--line); margin-bottom:18px;
  }
  .chart-card h3{ font-size:15px; margin-bottom:12px; }
  .chart-card canvas{ max-height:220px; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Cajero K.O.</h1>
    <p>Finanzas de Oliver &amp; Katerine</p>
    <div class="field">
      <label>Correo</label>
      <input type="email" id="loginEmail" placeholder="tucorreo@cajeroko.app">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="appShell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🪙</div>
      <div>
        <h1>Cajero K.O.</h1>
        <div class="who" id="whoAmI"></div>
      </div>
    </div>
    <button id="logoutBtn" onclick="doLogout()">Salir</button>
  </header>

  <main>
    <!-- RESUMEN -->
    <section class="view active" id="view-resumen">
      <div class="balance-grid" id="balanceGrid"></div>
      <div class="section-title"><h2>Actividad reciente</h2></div>
      <div id="recentList"></div>
    </section>

    <!-- MOVIMIENTOS (Ingresos / Gastos / Planes) -->
    <section class="view" id="view-movimientos">
      <div class="segmented" id="movSegmented">
        <button class="active" data-seg="ingresos" onclick="switchMovSegment('ingresos')">💵 Ingresos</button>
        <button data-seg="gastos" onclick="switchMovSegment('gastos')">🧾 Gastos</button>
        <button data-seg="planificacion" onclick="switchMovSegment('planificacion')">🗓️ Planes</button>
      </div>

      <div id="mov-ingresos" class="mov-panel">
        <div id="ingresosList"></div>
      </div>

      <div id="mov-gastos" class="mov-panel" style="display:none;">
        <div class="segmented" id="capaSegmented">
          <button class="active" data-capa="Todos" onclick="switchCapaFiltro('Todos')">Todos</button>
          <button data-capa="Pareja" onclick="switchCapaFiltro('Pareja')">🏠 Pareja</button>
          <button data-capa="Personal" onclick="switchCapaFiltro('Personal')">🙋 Personal</button>
        </div>
        <div id="gastosList"></div>
      </div>

      <div id="mov-planificacion" class="mov-panel" style="display:none;">
        <div id="planList"></div>
      </div>
    </section>

    <!-- AHORRO -->
    <section class="view" id="view-ahorro">
      <div class="section-title"><h2>Ahorro</h2></div>
      <div class="balance-grid" id="ahorroGrid"></div>
      <div id="ahorroList"></div>
    </section>

    <!-- METAS -->
    <section class="view" id="view-metas">
      <div class="section-title"><h2>Metas y objetivos</h2></div>
      <div id="metasList"></div>
    </section>

    <!-- VISUAL (dashboard gráfico) -->
    <section class="view" id="view-visual">
      <div class="section-title"><h2>Panorama</h2></div>
      <div class="fact-grid" id="factGrid"></div>

      <div class="chart-card">
        <h3>Gasto por categoría (mes actual · Pareja)</h3>
        <canvas id="chartCategoria"></canvas>
      </div>

      <div class="chart-card">
        <h3>Ingresos vs. Gastos (últimos 6 meses)</h3>
        <canvas id="chartMensual"></canvas>
      </div>

      <div class="chart-card">
        <h3>Ahorro acumulado en el tiempo</h3>
        <canvas id="chartAhorro"></canvas>
      </div>

      <div class="section-title"><h2>Progreso de metas</h2></div>
      <div id="metasVisualList"></div>
    </section>
  </main>

  <button class="fab" id="fabBtn" onclick="openAddModal()">+</button>

  <nav class="bottomnav">
    <button class="active" data-view="resumen" onclick="switchView('resumen')"><span class="ic">📊</span>Resumen</button>
    <button data-view="movimientos" onclick="switchView('movimientos')"><span class="ic">🧾</span>Movim.</button>
    <button data-view="ahorro" onclick="switchView('ahorro')"><span class="ic">🐷</span>Ahorro</button>
    <button data-view="metas" onclick="switchView('metas')"><span class="ic">🎯</span>Metas</button>
    <button data-view="visual" onclick="switchView('visual')"><span class="ic">📈</span>Visual</button>
  </nav>
</div>

<!-- ===================== MODAL AGREGAR ===================== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="modalTitle">Agregar</h3>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ===================== LIBRERÍAS ===================== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script>
// ================= CONFIGURACIÓN FIREBASE =================
const firebaseConfig = {
  apiKey: "AIzaSyBs9lCd9FzI9mmjx1qMd7Iubf8FLrgVJoA",
  authDomain: "cajero-ok.firebaseapp.com",
  projectId: "cajero-ok",
  storageBucket: "cajero-ok.firebasestorage.app",
  messagingSenderId: "323366281561",
  appId: "1:323366281561:web:b86d99b9ea7ccda1332c48"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const PERSONAS = {
  "katerine@cajeroko.app": "Katerine",
  "oliver@cajeroko.app": "Oliver"
};
function nombreDe(email){ return PERSONAS[email] || email; }

let currentUser = null;
let currentPersona = null;

// ================= LOGIN =================
function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginError').textContent = "";
  auth.signInWithEmailAndPassword(email, pass).catch(err=>{
    document.getElementById('loginError').textContent = "No se pudo entrar: revisa correo y contraseña.";
  });
}
function doLogout(){ auth.signOut(); }

auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;
    currentPersona = nombreDe(user.email);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'block';
    document.getElementById('whoAmI').textContent = "Conectado como " + currentPersona;
    startListeners();
  } else {
    currentUser = null;
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appShell').style.display = 'none';
  }
});

// ================= NAV PRINCIPAL =================
let currentView = 'resumen';
let currentMovSegment = 'ingresos';
let currentCapaFiltro = 'Todos';

function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.bottomnav > button').forEach(b=>b.classList.remove('active'));
  document.querySelector('.bottomnav button[data-view="'+name+'"]').classList.add('active');
  const sinFab = (name==='resumen' || name==='visual');
  document.getElementById('fabBtn').style.display = sinFab ? 'none' : 'flex';
  currentView = name;
  if(name==='visual') renderVisual();
}

function switchMovSegment(seg){
  currentMovSegment = seg;
  document.querySelectorAll('#movSegmented button').forEach(b=>b.classList.remove('active'));
  document.querySelector('#movSegmented button[data-seg="'+seg+'"]').classList.add('active');
  document.querySelectorAll('.mov-panel').forEach(p=>p.style.display='none');
  document.getElementById('mov-'+seg).style.display='block';
}

function switchCapaFiltro(capa){
  currentCapaFiltro = capa;
  document.querySelectorAll('#capaSegmented button').forEach(b=>b.classList.remove('active'));
  document.querySelector('#capaSegmented button[data-capa="'+capa+'"]').classList.add('active');
  renderGastos();
}

// ================= DATOS EN MEMORIA =================
let ingresos = [];
let gastos = [];
let planes = [];
let ahorros = [];
let metas = [];
let saldosIniciales = { Oliver: 0, Katerine: 0 };

function startListeners(){
  db.collection('ingresos').orderBy('fecha','desc').onSnapshot(snap=>{
    ingresos = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  });
  db.collection('gastos').orderBy('fecha','desc').onSnapshot(snap=>{
    gastos = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  });
  db.collection('planificacion').orderBy('anio','desc').onSnapshot(snap=>{
    planes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  });
  db.collection('ahorros').orderBy('fecha','desc').onSnapshot(snap=>{
    ahorros = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  });
  db.collection('metas').orderBy('createdAt','desc').onSnapshot(snap=>{
    metas = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  });
  db.collection('config').doc('saldoInicial').onSnapshot(doc=>{
    if(doc.exists) saldosIniciales = doc.data();
    renderAll();
  });
}

function renderAll(){
  renderResumen();
  renderIngresos();
  renderGastos();
  renderPlanificacion();
  renderAhorro();
  renderMetas();
  if(currentView==='visual') renderVisual();
}

// ================= HELPERS =================
function q(monto){ return "Q " + Number(monto||0).toLocaleString('es-GT',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtFecha(f){ if(!f) return ""; const d = new Date(f+"T00:00:00"); return d.toLocaleDateString('es-GT',{day:'2-digit',month:'short',year:'numeric'}); }
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function personaClass(persona){
  if(persona==='Katerine') return 'persona-katerine';
  if(persona==='Oliver') return 'persona-oliver';
  if(persona==='50/50') return 'persona-5050';
  return '';
}
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const CATEGORIAS = [
  "🏠 Vivienda / Hogar","🛒 Despensa / Súper","🚗 Transporte","🍔 Comida Fuera","💊 Salud y Cuidado Personal",
  "🎭 Diversión y Ocio","🛍️ Compras Personales","💳 Deudas / Cuotas","🐶 Mascotas","🎁 Regalos",
  "💵 Gasto Libre","⚠️ Imprevistos"
];
const CAT_COLORS = ['#B38D97','#564256','#3581B8','#7FB8DD','#9B4351','#D0F4EA','#7A6B7A','#C9A0AC','#264653','#E6C79C','#8AA399','#D9C6DA'];

function gastoShare(g, persona){
  if(g.quienPaga === persona) return Number(g.monto)||0;
  if(g.quienPaga === "50/50") return (Number(g.monto)||0) / 2;
  return 0;
}

function calcularAhorro(persona){
  const aportes = ahorros.filter(a=>a.quien===persona && a.tipo==='Aporte').reduce((s,a)=>s+Number(a.monto||0),0);
  const retiros = ahorros.filter(a=>a.quien===persona && a.tipo==='Retiro').reduce((s,a)=>s+Number(a.monto||0),0);
  return { aportes, retiros, saldoAhorro: aportes - retiros };
}

function calcularSaldo(persona){
  const totalIngresos = ingresos.filter(i=>i.persona===persona).reduce((s,i)=>s+Number(i.monto||0),0);
  const totalGastos = gastos.reduce((s,g)=>s+gastoShare(g,persona),0);
  const porPagar = planes.filter(p=>p.persona===persona && p.estado==='Planificado' && p.incluirEnSaldo!==false)
                          .reduce((s,p)=>s+Number(p.monto||0),0);
  const { aportes, retiros } = calcularAhorro(persona);
  const inicial = Number(saldosIniciales[persona]||0);
  return { saldo: inicial + totalIngresos - totalGastos - porPagar - aportes + retiros, porPagar };
}

function calcularAvanceMeta(metaId){
  const movs = ahorros.filter(a=>a.metaId===metaId);
  const aportes = movs.filter(a=>a.tipo==='Aporte').reduce((s,a)=>s+Number(a.monto||0),0);
  const retiros = movs.filter(a=>a.tipo==='Retiro').reduce((s,a)=>s+Number(a.monto||0),0);
  return aportes - retiros;
}

    const tituloClass = p.estado==='Ejecutado' ? 'receipt-title strike' : 'receipt-title';

        <button class="btn btn-danger btn-small" onclick="cancelarPlan('${p.id}')">🚫 Cancelar</button>`;
    } else if(p.estado==='Ejecutado'){
      botones = `<button class="btn btn-ghost btn-small" onclick="deshacerEjecucion('${p.id}')">↩️ Deshacer</button>`;
    } else if(p.estado==='Cancelado'){

    return `
    <div class="receipt ${personaClass(p.persona)}">

          ${veces>0?`<span class="tag">Pospuesto x${veces}</span>`:''}
          ${p.incluirEnSaldo===false?'<span class="tag">No incluido en saldo</span>':''}
        </div>

function marcarPagado(id){
  const p = planes.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`¿Marcar "${p.concepto}" como pagado? Esto va a crear el gasto real en Gastos por ${q(p.monto)}.`)) return;

  db.collection('gastos').add({
    fecha: hoyISO(),
    descripcion: p.concepto,
    monto: p.monto,
    quienPaga: p.persona,
    categoria: p.categoria || "",
    capa: 'Pareja',
    vinculoPlanId: p.id,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(docRef=>{
    db.collection('planificacion').doc(id).update({
      estado: 'Ejecutado',
      fechaEjecutado: hoyISO(),
      gastoVinculadoId: docRef.id
    });
  });
}

function deshacerEjecucion(id){
  const p = planes.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`¿Deshacer el pago de "${p.concepto}"? Esto borra el gasto que se había creado y regresa el plan a Planificado.`)) return;

  const borrarGasto = p.gastoVinculadoId
    ? db.collection('gastos').doc(p.gastoVinculadoId).delete().catch(()=>{})
    : Promise.resolve();

  borrarGasto.then(()=>{
    db.collection('planificacion').doc(id).update({
      estado: 'Planificado',
      fechaEjecutado: firebase.firestore.FieldValue.delete(),
      gastoVinculadoId: firebase.firestore.FieldValue.delete()
    });
  });
}

function posponerPlan(id){
  const p = planes.find(x=>x.id===id);
  if(!p) return;
  let idx = MESES.indexOf(p.mes);
  let anio = Number(p.anio);
  idx++;
  if(idx>11){ idx=0; anio++; }
  db.collection('planificacion').doc(id).update({
    mes: MESES[idx], anio: anio,
    vecesPospuesto: (p.vecesPospuesto||0) + 1
  });
}

function regresarPlan(id){
  const p = planes.find(x=>x.id===id);
  if(!p || !(p.vecesPospuesto>0)) return;
  let idx = MESES.indexOf(p.mes);
  let anio = Number(p.anio);
  idx--;
  if(idx<0){ idx=11; anio--; }
  db.collection('planificacion').doc(id).update({
    mes: MESES[idx], anio: anio,
    vecesPospuesto: p.vecesPospuesto - 1
  });
}

function cancelarPlan(id){
  if(!confirm("¿Cancelar este plan? Dejará de contarse en 'Por pagar'.")) return;
  db.collection('planificacion').doc(id).update({ estado: 'Cancelado' });
}
function reactivarPlan(id){
  db.collection('planificacion').doc(id).update({ estado: 'Planificado' });
}

let chartCategoriaInst=null, chartMensualInst=null, chartAhorroInst=null;

  renderChartCategoria();

function renderFunFacts(){
  const hoy = new Date();
  const mesActual = MESES[hoy.getMonth()];
  const anioActual = hoy.getFullYear();
  const gastosParejaMes = gastos.filter(g=>(g.capa||'Pareja')==='Pareja' && g.fecha && g.fecha.startsWith(anioActual+"-"+String(hoy.getMonth()+1).padStart(2,'0')));

  const totalMes = gastosParejaMes.reduce((s,g)=>s+Number(g.monto||0),0);
  const diasDelMes = new Date(anioActual, hoy.getMonth()+1, 0).getDate();
  const promedioDiario = totalMes / diasDelMes;

  const porCategoria = {};
  gastosParejaMes.forEach(g=>{ porCategoria[g.categoria||'Sin categoría'] = (porCategoria[g.categoria||'Sin categoría']||0) + Number(g.monto||0); });
  let catTop = "—", catTopMonto = 0;
  Object.entries(porCategoria).forEach(([cat,monto])=>{ if(monto>catTopMonto){ catTopMonto=monto; catTop=cat; } });

  const porDia = [0,0,0,0,0,0,0];
  gastos.filter(g=>(g.capa||'Pareja')==='Pareja' && g.fecha).forEach(g=>{
    const d = new Date(g.fecha+"T00:00:00").getDay();
    porDia[d] += Number(g.monto||0);
  });
  const diasNombre = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  let diaTopIdx = 0;
  porDia.forEach((v,i)=>{ if(v>porDia[diaTopIdx]) diaTopIdx=i; });

  const totalIngresoHist = ingresos.reduce((s,i)=>s+Number(i.monto||0),0);
  const totalAhorroHist = ahorros.filter(a=>a.tipo==='Aporte').reduce((s,a)=>s+Number(a.monto||0),0);
  const pctAhorrado = totalIngresoHist>0 ? Math.round((totalAhorroHist/totalIngresoHist)*100) : 0;

  document.getElementById('factGrid').innerHTML = `
    <div class="fact-card"><span class="ic">📅</span><div class="val num">${q(promedioDiario)}</div><div class="lbl">Gasto promedio diario (${mesActual})</div></div>
    <div class="fact-card"><span class="ic">🏆</span><div class="val">${catTop}</div><div class="lbl">Categoría con más gasto este mes</div></div>
    <div class="fact-card"><span class="ic">📆</span><div class="val">${diasNombre[diaTopIdx]}</div><div class="lbl">Día en que más se gasta</div></div>
    <div class="fact-card"><span class="ic">🐷</span><div class="val">${pctAhorrado}%</div><div class="lbl">Del ingreso total se ha ahorrado</div></div>
  `;
}

function renderChartCategoria(){
  const hoy = new Date();
  const prefijo = hoy.getFullYear()+"-"+String(hoy.getMonth()+1).padStart(2,'0');
  const gastosMes = gastos.filter(g=>(g.capa||'Pareja')==='Pareja' && g.fecha && g.fecha.startsWith(prefijo));
  const porCategoria = {};
  gastosMes.forEach(g=>{ const c=g.categoria||'Sin categoría'; porCategoria[c]=(porCategoria[c]||0)+Number(g.monto||0); });
  const labels = Object.keys(porCategoria);
  const data = Object.values(porCategoria);
  const colors = labels.map((_,i)=>CAT_COLORS[i % CAT_COLORS.length]);

  if(chartCategoriaInst) chartCategoriaInst.destroy();
  const ctx = document.getElementById('chartCategoria').getContext('2d');
  if(labels.length===0){ return; }
  chartCategoriaInst = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth:0 }] },
    options: { plugins:{ legend:{ position:'bottom', labels:{ font:{family:'Quicksand'}, boxWidth:12 } } } }
  });
}

function renderChartMensual(){
  const hoy = new Date();
  const meses = [];
  for(let i=5;i>=0;i--){
    const d = new Date(hoy.getFullYear(), hoy.getMonth()-i, 1);
    meses.push({ label: MESES[d.getMonth()].slice(0,3)+" "+d.getFullYear(), prefijo: d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0') });
  }
  const ingresosPorMes = meses.map(m=> ingresos.filter(i=>i.fecha && i.fecha.startsWith(m.prefijo)).reduce((s,i)=>s+Number(i.monto||0),0));
  const gastosPorMes = meses.map(m=> gastos.filter(g=>(g.capa||'Pareja')==='Pareja' && g.fecha && g.fecha.startsWith(m.prefijo)).reduce((s,g)=>s+Number(g.monto||0),0));

  if(chartMensualInst) chartMensualInst.destroy();
  const ctx = document.getElementById('chartMensual').getContext('2d');
  chartMensualInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: meses.map(m=>m.label),
      datasets: [
        { label:'Ingresos', data: ingresosPorMes, backgroundColor:'#3581B8', borderRadius:6 },
        { label:'Gastos', data: gastosPorMes, backgroundColor:'#B38D97', borderRadius:6 }
      ]
    },
    options: { plugins:{ legend:{ labels:{ font:{family:'Quicksand'} } } }, scales:{ y:{ beginAtZero:true } } }
  });
}

function renderChartAhorro(){
  const ordenados = [...ahorros].sort((a,b)=> (a.fecha>b.fecha?1:-1));
  let acumulado = 0;
  const labels = [], data = [];
  ordenados.forEach(a=>{
    acumulado += (a.tipo==='Aporte' ? Number(a.monto||0) : -Number(a.monto||0));
    labels.push(fmtFecha(a.fecha));
    data.push(acumulado);
  });

  if(chartAhorroInst) chartAhorroInst.destroy();
  const ctx = document.getElementById('chartAhorro').getContext('2d');
  chartAhorroInst = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ label:'Ahorro acumulado', data, borderColor:'#564256', backgroundColor:'rgba(86,66,86,.12)', fill:true, tension:.25 }] },
    options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true } } }
  });
}

function renderMetasVisual(){
  const list = document.getElementById('metasVisualList');
  if(metas.length===0){
    list.innerHTML = `<div class="empty-state"><span class="ic">🎯</span>Cuando creen una meta, aquí va a verse su progreso como un anillo.</div>`;
    return;
  }
  list.innerHTML = metas.map(m=>{
    const llevo = calcularAvanceMeta(m.id);
    const pct = m.montoObjetivo>0 ? Math.min(100, Math.round((llevo/m.montoObjetivo)*100)) : 0;
    const color = pct>=100 ? '#3581B8' : '#B38D97';
    return `
    <div class="meta-card">
      <div class="ring-wrap">
        <div class="ring" style="background:conic-gradient(${color} ${pct*3.6}deg, #E3E3E3 0deg);"></div>
        <div class="ring-center">${pct}%</div>
      </div>
      <div class="meta-info">
        <div class="title">${m.nombre}</div>
        <div class="prog-text">${q(llevo)} de ${q(m.montoObjetivo)}</div>
      </div>
    </div>`;
  }).join("");
}

// ================= MODAL: AGREGAR (según sección activa) =================
function openAddModal(){
  const overlay = document.getElementById('modalOverlay');
  const title = document.getElementById('modalTitle');
  const body = document.getElementById('modalBody');

  if(currentView==='movimientos' && currentMovSegment==='ingresos'){
    title.textContent = "Nuevo ingreso";
    body.innerHTML = `
      <div class="field"><label>Descripción</label><input id="f_desc" placeholder="Ej. Salario, Bono, etc."></div>
      <div class="field"><label>Monto (Q)</label><input id="f_monto" type="number" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>Fecha</label><input id="f_fecha" type="date" value="${hoyISO()}"></div>
      <div class="field"><label>¿Para quién?</label>
        <select id="f_persona"><option>Katerine</option><option>Oliver</option></select>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="guardarIngreso()">Guardar ingreso</button>`;
  }
  else if(currentView==='movimientos' && currentMovSegment==='gastos'){
    title.textContent = "Nuevo gasto";
    body.innerHTML = `
      <div class="field"><label>Descripción</label><input id="f_desc" placeholder="Ej. Súper, Gasolina..."></div>
      <div class="field"><label>Monto (Q)</label><input id="f_monto" type="number" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>Fecha</label><input id="f_fecha" type="date" value="${hoyISO()}"></div>
      <div class="field"><label>Capa</label>
        <select id="f_capa" onchange="toggleQuienPagaOpciones()">
          <option value="Pareja">🏠 Pareja (compartido)</option>
          <option value="Personal">🙋 Personal (solo mío)</option>
        </select>
      </div>
      <div class="field"><label>¿Quién paga?</label>
        <select id="f_quien"><option>Katerine</option><option>Oliver</option><option>50/50</option></select>
      </div>
      <div class="field"><label>Categoría</label>
        <select id="f_cat">${CATEGORIAS.map(c=>`<option>${c}</option>`).join("")}</select>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="guardarGasto()">Guardar gasto</button>`;
  }
  else if(currentView==='movimientos' && currentMovSegment==='planificacion'){
    title.textContent = "Nuevo plan";
    const hoy = new Date();
    body.innerHTML = `
      <div class="field"><label>Concepto</label><input id="f_desc" placeholder="Ej. Renta, Ortodoncia..."></div>
      <div class="field"><label>Monto presupuestado (Q)</label><input id="f_monto" type="number" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>Mes</label>
        <select id="f_mes">${MESES.map((m,i)=>`<option ${i===hoy.getMonth()?'selected':''}>${m}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Año</label><input id="f_anio" type="number" value="${hoy.getFullYear()}"></div>
      <div class="field"><label>¿Para quién?</label>
        <select id="f_persona"><option>Katerine</option><option>Oliver</option></select>
      </div>
      <div class="field field-check"><input type="checkbox" id="f_incluir" checked><label style="margin:0;">Incluir en saldo desde ya</label></div>
      <button class="btn btn-primary" style="width:100%" onclick="guardarPlan()">Guardar plan</button>`;
  }
  else if(currentView==='ahorro'){
    title.textContent = "Nuevo movimiento de ahorro";
    body.innerHTML = `
      <div class="field"><label>Tipo</label>
        <select id="f_tipo"><option>Aporte</option><option>Retiro</option></select>
      </div>
      <div class="field"><label>¿Quién?</label>
        <select id="f_persona"><option>Katerine</option><option>Oliver</option></select>
      </div>
      <div class="field"><label>Monto (Q)</label><input id="f_monto" type="number" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>Fecha</label><input id="f_fecha" type="date" value="${hoyISO()}"></div>
      <div class="field"><label>Nota (opcional)</label><input id="f_nota" placeholder="Ej. Ahorro general"></div>
      <p style="font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-top:-6px;">
        Un <strong>Aporte</strong> resta de tu disponible y suma a lo ahorrado. Un <strong>Retiro</strong> hace lo contrario.
      </p>
      <button class="btn btn-primary" style="width:100%" onclick="guardarAhorro()">Guardar movimiento</button>`;
  }
  else if(currentView==='metas'){
    title.textContent = "Nueva meta u objetivo";
    body.innerHTML = `
      <div class="field"><label>Nombre</label><input id="f_nombre" placeholder="Ej. Removedor láser, TV, viaje..."></div>
      <div class="field"><label>Monto objetivo (Q)</label><input id="f_objetivo" type="number" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>¿En cuántos meses?</label><input id="f_meses" type="number" placeholder="Ej. 4"></div>
      <div class="field"><label>Foto (link de imagen, opcional)</label><input id="f_foto" placeholder="https://..."></div>
      <button class="btn btn-primary" style="width:100%" onclick="guardarMeta()">Guardar meta</button>`;
  }
  else { return; }

  overlay.classList.add('active');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('active'); }

function toggleQuienPagaOpciones(){
  const capa = document.getElementById('f_capa').value;
  const sel = document.getElementById('f_quien');
  if(capa==='Personal'){
    sel.innerHTML = `<option>Katerine</option><option>Oliver</option>`;
  } else {
    sel.innerHTML = `<option>Katerine</option><option>Oliver</option><option>50/50</option>`;
  }
}

function guardarIngreso(){
  const desc = document.getElementById('f_desc').value.trim();
  const monto = parseFloat(document.getElementById('f_monto').value);
  const fecha = document.getElementById('f_fecha').value;
  const persona = document.getElementById('f_persona').value;
  if(!monto || !fecha){ alert("Falta el monto o la fecha."); return; }
  db.collection('ingresos').add({
    descripcion: desc, monto, fecha, persona,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  closeModal();
}

function guardarGasto(){
  const desc = document.getElementById('f_desc').value.trim();
  const monto = parseFloat(document.getElementById('f_monto').value);
  const fecha = document.getElementById('f_fecha').value;
  const capa = document.getElementById('f_capa').value;
  const quienPaga = document.getElementById('f_quien').value;
  const categoria = document.getElementById('f_cat').value;
  if(!monto || !fecha){ alert("Falta el monto o la fecha."); return; }
  db.collection('gastos').add({
    descripcion: desc, monto, fecha, quienPaga, categoria, capa,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  closeModal();
}

function guardarPlan(){
  const concepto = document.getElementById('f_desc').value.trim();
  const monto = parseFloat(document.getElementById('f_monto').value);
  const mes = document.getElementById('f_mes').value;
  const anio = parseInt(document.getElementById('f_anio').value);
  const persona = document.getElementById('f_persona').value;
  const incluirEnSaldo = document.getElementById('f_incluir').checked;
  if(!concepto || !monto){ alert("Falta el concepto o el monto."); return; }
  db.collection('planificacion').add({
    concepto, monto, mes, anio, persona, incluirEnSaldo,
    estado: 'Planificado', vecesPospuesto: 0,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  closeModal();
}

function guardarAhorro(){
  const tipo = document.getElementById('f_tipo').value;
  const quien = document.getElementById('f_persona').value;
  const monto = parseFloat(document.getElementById('f_monto').value);
  const fecha = document.getElementById('f_fecha').value;
  const nota = document.getElementById('f_nota').value.trim();
  if(!monto || !fecha){ alert("Falta el monto o la fecha."); return; }
  db.collection('ahorros').add({
    tipo, quien, monto, fecha, nota, metaId: null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  closeModal();
}

function guardarMeta(){
  const nombre = document.getElementById('f_nombre').value.trim();
  const montoObjetivo = parseFloat(document.getElementById('f_objetivo').value);
  const meses = parseInt(document.getElementById('f_meses').value);
  const fotoURL = document.getElementById('f_foto').value.trim();
  if(!nombre || !montoObjetivo){ alert("Falta el nombre o el monto objetivo."); return; }
  db.collection('metas').add({
    nombre, montoObjetivo, meses: meses||1, fotoURL, estado:'Activa',
    fechaInicio: hoyISO(),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  closeModal();
}
</script>
