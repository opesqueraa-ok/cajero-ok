<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cajero K.O.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EBEBEB;
    --ink: #564256;       /* morado oscuro de Katerine, usado como color de marca neutral */
    --ink-soft: #7A6B7A;
    --card: #FFFFFF;
    --line: #DADADA;

    /* Colores de Katerine */
    --kat-primary: #B38D97;
    --kat-dark: #564256;
    --kat-tint: #F3E9EC;

    /* Colores de Oliver */
    --oli-primary: #3581B8;
    --oli-light: #D0F4EA;
    --oli-tint: #E6F3F9;

    --danger: #9B4351;
    --radius: 16px;
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Quicksand',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;
  }
  h1,h2,h3{ font-family:'Quicksand',sans-serif; font-weight:700; margin:0; }
  .num{ font-variant-numeric:tabular-nums; font-weight:600; }

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, var(--kat-dark) 0%, var(--oli-primary) 100%);
    padding:24px;
  }
  .login-card{
    background:var(--card); border-radius:22px; padding:40px 32px; width:100%; max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .login-card h1{ font-size:28px; color:var(--ink); margin-bottom:4px; }
  .login-card p{ color:var(--ink-soft); margin:0 0 24px; font-size:14px; font-weight:500; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:6px; font-weight:600; }
  .field input, .field select{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-family:'Quicksand',sans-serif; font-size:15px; font-weight:500; background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--ink); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:12px; padding:12px 18px; font-family:'Quicksand',sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--ink); color:#fff; width:100%; }
  .btn-primary:hover{ opacity:.9; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-katerine{ background:var(--kat-primary); color:#fff; }
  .btn-oliver{ background:var(--oli-primary); color:#fff; }
  .btn-small{ padding:8px 12px; font-size:12.5px; border-radius:10px; }
  #loginError{ color:var(--danger); font-size:13px; margin-top:10px; min-height:16px; font-weight:600; }

  /* ---------- App shell ---------- */
  #appShell{ display:none; }
  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--ink); color:#fff;
    padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
  }
  header.topbar .brand{ display:flex; align-items:center; gap:10px; }
  header.topbar .brand-mark{
    width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg, var(--kat-primary), var(--oli-primary));
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  header.topbar h1{ font-size:19px; color:#fff; }
  header.topbar .who{ font-size:12px; color:#D9CDD9; font-weight:600; }
  #logoutBtn{ background:none; border:1px solid rgba(255,255,255,.3); color:#EFE7EF; border-radius:10px; padding:6px 10px; font-size:12px; cursor:pointer; font-family:'Quicksand',sans-serif; font-weight:600; }

  main{ max-width:640px; margin:0 auto; padding:20px 16px 40px; }

  /* Bottom nav */
  nav.bottomnav{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--ink); display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottomnav button{
    flex:1; background:none; border:none; color:#C9B9C9; font-family:'Quicksand',sans-serif;
    font-size:11px; font-weight:600; padding:8px 2px; border-radius:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  nav.bottomnav button .ic{ font-size:18px; }
  nav.bottomnav button.active{ color:#fff; background:rgba(255,255,255,.14); }

  .view{ display:none; }
  .view.active{ display:block; animation:fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Summary cards ---------- */
  .balance-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .balance-card{
    border-radius:var(--radius); padding:18px 16px;
    border:1px solid var(--line); position:relative; overflow:hidden;
  }
  .balance-card.card-katerine{ background:var(--kat-tint); }
  .balance-card.card-oliver{ background:var(--oli-tint); }
  .balance-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px;
  }
  .balance-card.card-katerine::before{ background:var(--kat-primary); }
  .balance-card.card-oliver::before{ background:var(--oli-primary); }
  .balance-card .name{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:6px; font-weight:700; }
  .balance-card .amount{ font-size:24px; font-weight:700; }
  .balance-card .amount.neg{ color:var(--danger); }
  .balance-card .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-weight:600; }

  .section-title{ display:flex; align-items:center; justify-content:space-between; margin:24px 0 12px; }
  .section-title h2{ font-size:18px; }

  /* ---------- Receipt-style list items (signature element) ---------- */
  .receipt{
    background:var(--card); border-radius:12px; margin-bottom:10px; padding:14px 16px 14px 20px;
    border:1px solid var(--line); position:relative;
  }
  .receipt::before{
    content:""; position:absolute; left:0; top:8px; bottom:8px; width:4px; border-radius:4px;
    background:var(--ink-soft);
  }
  .receipt.persona-katerine::before{ background:var(--kat-primary); }
  .receipt.persona-oliver::before{ background:var(--oli-primary); }
  .receipt.persona-5050::before{ background:linear-gradient(180deg, var(--kat-primary) 0 50%, var(--oli-primary) 50% 100%); }
  .receipt-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .receipt-title{ font-weight:700; font-size:15px; }
  .receipt-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-weight:600; }
  .receipt-amount{ font-weight:700; font-size:15px; white-space:nowrap; }
  .tag{
    display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:20px; margin-top:6px; margin-right:4px;
    background:#EDEDED; color:var(--ink-soft); font-family:'Quicksand',sans-serif; font-weight:700;
  }
  .tag.planificado{ background:#F3E9EC; color:var(--kat-dark); }
  .tag.ejecutado{ background:var(--oli-light); color:var(--oli-primary); }
  .tag.cancelado{ background:#F1E1E4; color:var(--danger); }
  .strike{ text-decoration:line-through; opacity:.55; }
  .actions-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  .fab{
    position:fixed; right:18px; bottom:88px; z-index:25;
    width:56px; height:56px; border-radius:50%; background:var(--ink); color:#fff;
    font-size:26px; border:none; box-shadow:0 8px 20px rgba(86,66,86,.4); cursor:pointer;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(86,66,86,.45); z-index:50;
    align-items:flex-end; justify-content:center;
  }
  .modal-overlay.active{ display:flex; }
  .modal{
    background:var(--bg); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:24px 20px 32px;
    max-height:88vh; overflow-y:auto; animation:slideUp .2s ease;
  }
  @keyframes slideUp{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .modal h3{ font-size:19px; margin-bottom:16px; }
  .modal-close{ float:right; background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; }
  .empty-state{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-weight:600; }
  .empty-state .ic{ font-size:34px; display:block; margin-bottom:10px; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Cajero K.O.</h1>
    <p>Finanzas de Oliver &amp; Katerine</p>
    <div class="field">
      <label>Correo</label>
      <input type="email" id="loginEmail" placeholder="tucorreo@cajeroko.app">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="appShell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🪙</div>
      <div>
        <h1>Cajero K.O.</h1>
        <div class="who" id="whoAmI"></div>
      </div>
    </div>
    <button id="logoutBtn" onclick="doLogout()">Salir</button>
  </header>

  <main>
    <!-- RESUMEN -->
    <section class="view active" id="view-resumen">
      <div class="balance-grid" id="balanceGrid"></div>
      <div class="section-title"><h2>Actividad reciente</h2></div>
      <div id="recentList"></div>
    </section>

    <!-- INGRESOS -->
    <section class="view" id="view-ingresos">
      <div class="section-title"><h2>Ingresos</h2></div>
      <div id="ingresosList"></div>
    </section>

    <!-- GASTOS -->
    <section class="view" id="view-gastos">
      <div class="section-title"><h2>Gastos</h2></div>
      <div id="gastosList"></div>
    </section>

    <!-- PLANIFICACION -->
    <section class="view" id="view-planificacion">
      <div class="section-title"><h2>Planificación</h2></div>
      <div id="planList"></div>
    </section>
  </main>

  <button class="fab" id="fabBtn" onclick="openAddModal()">+</button>

  <nav class="bottomnav">
    <button class="active" data-view="resumen" onclick="switchView('resumen')"><span class="ic">📊</span>Resumen</button>
    <button data-view="ingresos" onclick="switchView('ingresos')"><span class="ic">💵</span>Ingresos</button>
    <button data-view="gastos" onclick="switchView('gastos')"><span class="ic">🧾</span>Gastos</button>
    <button data-view="planificacion" onclick="switchView('planificacion')"><span class="ic">🗓️</span>Planes</button>
  </nav>
</div>

<!-- ===================== MODAL AGREGAR ===================== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="modalTitle">Agregar</h3>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ===================== FIREBASE ===================== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
// ================= CONFIGURACIÓN FIREBASE =================
const firebaseConfig = {
  apiKey: "AIzaSyBs9lCd9FzI9mmjx1qMd7Iubf8FLrgVJoA",
  authDomain: "cajero-ok.firebaseapp.com",
  projectId: "cajero-ok",
  storageBucket: "cajero-ok.firebasestorage.app",
  messagingSenderId: "323366281561",
  appId: "1:323366281561:web:b86d99b9ea7ccda1332c48"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Mapea el correo con el nombre que se muestra en la app.
const PERSONAS = {
  "katerine@cajeroko.app": "Katerine",
  "oliver@cajeroko.app": "Oliver"
};
function nombreDe(email){ return PERSONAS[email] || email; }

let currentUser = null;
let currentPersona = null;

// ================= LOGIN =================
function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginError').textContent = "";
  auth.signInWithEmailAndPassword(email, pass).catch(err=>{
    document.getElementById('loginError').textContent = "No se pudo entrar: revisa correo y contraseña.";
  });
}
function doLogout(){ auth.signOut(); }

auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;
    currentPersona = nombreDe(user.email);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'block';
    document.getElementById('whoAmI').textContent = "Conectado como " + currentPersona;
    startListeners();
  } else {
    currentUser = null;
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appShell').style.display = 'none';
  }
});

// ================= NAV =================
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.bottomnav button').forEach(b=>b.classList.remove('active'));
  document.querySelector('.bottomnav button[data-view="'+name+'"]').classList.add('active');
  document.getElementById('fabBtn').style.display = (name==='resumen') ? 'none' : 'flex';
  currentView = name;
}
let currentView = 'resumen';

// ================= DATOS EN MEMORIA =================
let ingresos = [];
let gastos = [];
let planes = [];
let saldosIniciales = { Oliver: 0, Katerine: 0 };

function startListeners(){
  db.collection('ingresos').orderBy('fecha','desc').onSnapshot(snap=>{
    ingresos = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  });
  db.collection('gastos').orderBy('fecha','desc').onSnapshot(snap=>{
    gastos = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  });
  db.collection('planificacion').orderBy('anio','desc').onSnapshot(snap=>{
    planes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  });
  db.collection('config').doc('saldoInicial').onSnapshot(doc=>{
    if(doc.exists) saldosIniciales = doc.data();
    renderAll();
  });
}

function renderAll(){
  renderResumen();
  renderIngresos();
  renderGastos();
  renderPlanificacion();
}

// ================= HELPERS =================
function q(monto){ return "Q " + Number(monto||0).toLocaleString('es-GT',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtFecha(f){ if(!f) return ""; const d = new Date(f+"T00:00:00"); return d.toLocaleDateString('es-GT',{day:'2-digit',month:'short',year:'numeric'}); }
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function personaClass(persona){
  if(persona==='Katerine') return 'persona-katerine';
  if(persona==='Oliver') return 'persona-oliver';
  if(persona==='50/50') return 'persona-5050';
  return '';
}

function gastoShare(g, persona){
  if(g.quienPaga === persona) return Number(g.monto)||0;
  if(g.quienPaga === "50/50") return (Number(g.monto)||0) / 2;
  return 0;
}

function calcularSaldo(persona){
  const totalIngresos = ingresos.filter(i=>i.persona===persona).reduce((s,i)=>s+Number(i.monto||0),0);
  const totalGastos = gastos.reduce((s,g)=>s+gastoShare(g,persona),0);
  const porPagar = planes.filter(p=>p.persona===persona && p.estado==='Planificado' && p.incluirEnSaldo!==false)
                          .reduce((s,p)=>s+Number(p.monto||0),0);
  const inicial = Number(saldosIniciales[persona]||0);
  return { saldo: inicial + totalIngresos - totalGastos - porPagar, porPagar };
}

// ================= RENDER: RESUMEN =================
function renderResumen(){
  const grid = document.getElementById('balanceGrid');
  grid.innerHTML = "";
  ["Katerine","Oliver"].forEach(persona=>{
    const {saldo, porPagar} = calcularSaldo(persona);
    const cardClass = persona==='Katerine' ? 'card-katerine' : 'card-oliver';
    grid.innerHTML += `
      <div class="balance-card ${cardClass}">
        <div class="name">${persona}</div>
        <div class="amount num ${saldo<0?'neg':''}">${q(saldo)}</div>
        <div class="sub">Por pagar: ${q(porPagar)}</div>
      </div>`;
  });

  const items = [
    ...ingresos.map(i=>({tipo:'ingreso', fecha:i.fecha, desc:i.descripcion, monto:i.monto, persona:i.persona})),
    ...gastos.map(g=>({tipo:'gasto', fecha:g.fecha, desc:g.descripcion, monto:g.monto, persona:g.quienPaga}))
  ].sort((a,b)=> (a.fecha<b.fecha?1:-1)).slice(0,8);

  const list = document.getElementById('recentList');
  if(items.length===0){
    list.innerHTML = `<div class="empty-state"><span class="ic">🧺</span>Todavía no hay movimientos registrados.</div>`;
    return;
  }
  list.innerHTML = items.map(it=>`
    <div class="receipt ${personaClass(it.persona)}">
      <div class="receipt-row">
        <div>
          <div class="receipt-title">${it.desc||"(sin descripción)"}</div>
          <div class="receipt-sub">${fmtFecha(it.fecha)} · ${it.persona||""}</div>
        </div>
        <div class="receipt-amount num">
          ${it.tipo==='ingreso'?'+':'-'} ${q(it.monto)}
        </div>
      </div>
    </div>
  `).join("");
}

// ================= RENDER: INGRESOS =================
function renderIngresos(){
  const list = document.getElementById('ingresosList');
  if(ingresos.length===0){
    list.innerHTML = `<div class="empty-state"><span class="ic">💵</span>Aún no hay ingresos. Toca + para agregar uno.</div>`;
    return;
  }
  list.innerHTML = ingresos.map(i=>`
    <div class="receipt ${personaClass(i.persona)}">
      <div class="receipt-row">
        <div>
          <div class="receipt-title">${i.descripcion||"(sin descripción)"}</div>
          <div class="receipt-sub">${fmtFecha(i.fecha)} · ${i.persona}</div>
        </div>
        <div class="receipt-amount num">+ ${q(i.monto)}</div>
      </div>
      <div class="actions-row">
        <button class="btn btn-ghost btn-small" onclick="eliminarIngreso('${i.id}')">🗑️ Borrar</button>
      </div>
    </div>
  `).join("");
}
function eliminarIngreso(id){
  if(confirm("¿Borrar este ingreso?")) db.collection('ingresos').doc(id).delete();
}

// ================= RENDER: GASTOS =================
function renderGastos(){
  const list = document.getElementById('gastosList');
  if(gastos.length===0){
    list.innerHTML = `<div class="empty-state"><span class="ic">🧾</span>Aún no hay gastos. Toca + para agregar uno.</div>`;
    return;
  }
  list.innerHTML = gastos.map(g=>`
    <div class="receipt ${personaClass(g.quienPaga)}">
      <div class="receipt-row">
        <div>
          <div class="receipt-title">${g.descripcion||"(sin descripción)"}</div>
          <div class="receipt-sub">${fmtFecha(g.fecha)} · ${g.quienPaga} ${g.categoria?('· '+g.categoria):''}</div>
          ${g.vinculoPlanId?'<span class="tag ejecutado">Desde plan</span>':''}
        </div>
        <div class="receipt-amount num">- ${q(g.monto)}</div>
      </div>
      <div class="actions-row">
        <button class="btn btn-ghost btn-small" onclick="eliminarGasto('${g.id}')">🗑️ Borrar</button>
      </div>
    </div>
  `).join("");
}
function eliminarGasto(id){
  if(confirm("¿Borrar este gasto? Si viene de un plan ejecutado, el plan quedará marcado como pagado pero sin el gasto real — mejor usa 'Deshacer' desde Planificación en ese caso."))
    db.collection('gastos').doc(id).delete();
}

// ================= RENDER: PLANIFICACIÓN =================
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function renderPlanificacion(){
  const list = document.getElementById('planList');
  if(planes.length===0){
    list.innerHTML = `<div class="empty-state"><span class="ic">🗓️</span>Aún no hay nada planificado. Toca + para agregar un plan.</div>`;
    return;
  }
  list.innerHTML = planes.map(p=>{
    const tagClass = p.estado==='Ejecutado'?'ejecutado':(p.estado==='Cancelado'?'cancelado':'planificado');
    const tituloClass = p.estado==='Ejecutado' ? 'receipt-title strike' : 'receipt-title';
    let botones = "";
    if(p.estado==='Planificado'){
      botones = `
        <button class="btn btn-primary btn-small" onclick="marcarPagado('${p.id}')">✅ Marcar pagado</button>
        <button class="btn btn-ghost btn-small" onclick="posponerPlan('${p.id}')">⏭️ Posponer un mes</button>
        <button class="btn btn-danger btn-small" onclick="cancelarPlan('${p.id}')">🚫 Cancelar</button>`;
    } else if(p.estado==='Ejecutado'){
      botones = `<button class="btn btn-ghost btn-small" onclick="deshacerEjecucion('${p.id}')">↩️ Deshacer</button>`;
    } else if(p.estado==='Cancelado'){
      botones = `<button class="btn btn-ghost btn-small" onclick="reactivarPlan('${p.id}')">♻️ Reactivar</button>`;
    }
    return `
    <div class="receipt ${personaClass(p.persona)}">
      <div class="receipt-row">
        <div>
          <div class="${tituloClass}">${p.concepto}</div>
          <div class="receipt-sub">${p.mes} ${p.anio} · ${p.persona}</div>
          <span class="tag ${tagClass}">${p.estado}</span>
          ${p.incluirEnSaldo===false?'<span class="tag">No incluido en saldo</span>':''}
        </div>
        <div class="receipt-amount num">${q(p.monto)}</div>
      </div>
      <div class="actions-row">${botones}</div>
    </div>`;
  }).join("");
}

function marcarPagado(id){
  const p = planes.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`¿Marcar "${p.concepto}" como pagado? Esto va a crear el gasto real en Gastos por ${q(p.monto)}.`)) return;

  db.collection('gastos').add({
    fecha: hoyISO(),
    descripcion: p.concepto,
    monto: p.monto,
    quienPaga: p.persona,
    categoria: p.categoria || "",
    vinculoPlanId: p.id,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(docRef=>{
    db.collection('planificacion').doc(id).update({
      estado: 'Ejecutado',
      fechaEjecutado: hoyISO(),
      gastoVinculadoId: docRef.id
    });
  });
}

function deshacerEjecucion(id){
  const p = planes.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`¿Deshacer el pago de "${p.concepto}"? Esto borra el gasto que se había creado y regresa el plan a Planificado.`)) return;

  const borrarGasto = p.gastoVinculadoId
    ? db.collection('gastos').doc(p.gastoVinculadoId).delete().catch(()=>{})
    : Promise.resolve();

  borrarGasto.then(()=>{
    db.collection('planificacion').doc(id).update({
      estado: 'Planificado',
      fechaEjecutado: firebase.firestore.FieldValue.delete(),
      gastoVinculadoId: firebase.firestore.FieldValue.delete()
    });
  });
}

function posponerPlan(id){
  const p = planes.find(x=>x.id===id);
  if(!p) return;
  let idx = MESES.indexOf(p.mes);
  let anio = Number(p.anio);
  idx++;
  if(idx>11){ idx=0; anio++; }
  db.collection('planificacion').doc(id).update({ mes: MESES[idx], anio: anio });
}

function cancelarPlan(id){
  if(!confirm("¿Cancelar este plan? Dejará de contarse en 'Por pagar'.")) return;
  db.collection('planificacion').doc(id).update({ estado: 'Cancelado' });
}
function reactivarPlan(id){
  db.collection('planificacion').doc(id).update({ estado: 'Planificado' });
}

function closeModal(){ document.getElementById('modalOverlay').classList.remove('active'); }

function guardarIngreso(){
  const desc = document.getElementById('f_desc').value.trim();
  const monto = parseFloat(document.getElementById('f_monto').value);
  const fecha = document.getElementById('f_fecha').value;
  const persona = document.getElementById('f_persona').value;
  if(!monto || !fecha){ alert("Falta el monto o la fecha."); return; }
  db.collection('ingresos').add({
    descripcion: desc, monto, fecha, persona,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  closeModal();
}

function guardarGasto(){
  const desc = document.getElementById('f_desc').value.trim();
  const monto = parseFloat(document.getElementById('f_monto').value);
  const fecha = document.getElementById('f_fecha').value;
  const quienPaga = document.getElementById('f_quien').value;
  const categoria = document.getElementById('f_cat').value;
  if(!monto || !fecha){ alert("Falta el monto o la fecha."); return; }
  db.collection('gastos').add({
    descripcion: desc, monto, fecha, quienPaga, categoria,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  closeModal();
}

function guardarPlan(){
  const concepto = document.getElementById('f_desc').value.trim();
  const monto = parseFloat(document.getElementById('f_monto').value);
  const mes = document.getElementById('f_mes').value;
  const anio = parseInt(document.getElementById('f_anio').value);
  const persona = document.getElementById('f_persona').value;
  const incluirEnSaldo = document.getElementById('f_incluir').checked;
  if(!concepto || !monto){ alert("Falta el concepto o el monto."); return; }
  db.collection('planificacion').add({
    concepto, monto, mes, anio, persona, incluirEnSaldo,
    estado: 'Planificado',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  closeModal();
}
</script>
